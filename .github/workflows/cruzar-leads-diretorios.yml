name: Cruzar leads de diretorios com rascunhos
on:
  workflow_dispatch:
  push:
    paths:
      - "data/leads-diretorios.json"
      - "scripts/cruzar_leads_diretorios.py"
      - ".github/workflows/cruzar-leads-diretorios.yml"
permissions:
  contents: read
jobs:
  cruzar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install requests
      - name: Cruzar leads com rascunhos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/cruzar_leads_diretorios.py
      - uses: actions/upload-artifact@v6
        with:
          name: relatorio-cruzamento-diretorios
          path: relatorio-cruzamento-diretorios.csv
          if-no-files-found: error
          retention-days: 30
