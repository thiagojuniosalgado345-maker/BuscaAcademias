name: Aplicar atualizações verificadas no catálogo

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Executar sem gravar no Supabase"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
  push:
    paths:
      - "data/atualizacoes-verificadas.json"
      - "scripts/aplicar_atualizacoes_verificadas.py"

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: \${{ secrets.SUPABASE_SECRET_KEY }}
      DRY_RUN: \${{ github.event_name == 'push' && 'false' || (inputs.dry_run == 'false' && 'false' || 'true') }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install requests

      - name: Aplicar atualizações pré-validadas
        run: python scripts/aplicar_atualizacoes_verificadas.py

      - name: Disponibilizar relatório de execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-atualizacoes-verificadas
          path: relatorio-atualizacoes-verificadas.csv
          if-no-files-found: warn
