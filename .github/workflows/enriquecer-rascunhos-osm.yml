name: Enriquecer rascunhos com OpenStreetMap

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = simular; false = completar campos vazios dos rascunhos"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
  push:
    paths:
      - "scripts/enriquecer_rascunhos_osm.py"
      - ".github/workflows/enriquecer-rascunhos-osm.yml"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install requests

      - name: Enriquecer rascunhos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run == 'false' && 'false' || 'true') }}
        run: python scripts/enriquecer_rascunhos_osm.py
