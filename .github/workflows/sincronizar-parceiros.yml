name: Sincronizar parcerias oficiais no catálogo
on:
  push:
    paths:
      - 'data/parceiros-confirmados.json'
      - 'scripts/sincronizar_parceiros.py'
      - '.github/workflows/sincronizar-parceiros.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = simular; false = gravar parcerias e dados confirmados'
        required: true
        type: choice
        options: ['true', 'false']
        default: 'true'
permissions:
  contents: read
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install requests
      - name: Sincronizar dados oficiais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: 'false' # execução única autorizada; restaurar após o lote
        run: python scripts/sincronizar_parceiros.py
      - uses: actions/upload-artifact@v6
        with:
          name: relatorio-parceiros-confirmados
          path: relatorio-parceiros-confirmados.csv
          if-no-files-found: error
          retention-days: 30
