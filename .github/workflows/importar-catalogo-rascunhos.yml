name: Importar candidatos no catalogo como rascunhos

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/importar_catalogo_rascunhos.py"
      - ".github/workflows/importar-catalogo-rascunhos.yml"

permissions:
  contents: read

jobs:
  importar-rascunhos:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Simular importacao de rascunhos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: "true"
        run: python scripts/importar_catalogo_rascunhos.py
