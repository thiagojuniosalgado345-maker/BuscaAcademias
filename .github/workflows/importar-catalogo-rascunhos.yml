name: Importar candidatos no catalogo como rascunhos

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = simular; false = inserir rascunhos ocultos no site"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
  push:
    paths:
      - "scripts/importar_catalogo_rascunhos.py"
      - ".github/workflows/importar-catalogo-rascunhos.yml"

permissions:
  contents: read

jobs:
  importar-rascunhos:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Executar importador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false' && 'false' || 'true' }}
        run: python scripts/importar_catalogo_rascunhos.py
