<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuscaAcademias</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#071a36;
    color:white;
}


/* TOPO */

header{
    height:90px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 60px;
}

header img{
    width:170px;
}

.menu a{
    color:white;
    text-decoration:none;
    margin-left:35px;
    font-size:17px;
}


/* ÁREA PRINCIPAL */

.principal{

    min-height:650px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;

}


.logo-central img{

    width:260px;
    margin-bottom:35px;

}


h1{

    font-size:46px;
    line-height:1.15;
    max-width:800px;
    margin-bottom:20px;

}


.subtitulo{

    font-size:21px;
    color:#cbd5e1;
    margin-bottom:45px;

}


/* BUSCA */

.caixa-busca{

    background:white;
    width:450px;
    max-width:90%;
    padding:8px;
    border-radius:16px;
    display:flex;

}


.caixa-busca select{

    flex:1;
    border:none;
    padding:15px;
    font-size:17px;
    color:#333;
    outline:none;

}



.botao{

    margin-top:25px;

}


.botao button{

    background:#2563eb;
    border:none;
    color:white;
    padding:17px 55px;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;

}


/* BENEFÍCIOS */

.beneficios{

    background:#0d2347;
    padding:50px 30px;
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;

}


.item{

    background:#132d57;
    width:220px;
    padding:30px 20px;
    border-radius:18px;
    text-align:center;
    font-size:17px;

}


.item span{

    font-size:35px;

}



/* RODAPÉ */

footer{

    text-align:center;
    padding:25px;
    color:#b8c5db;

}



@media(max-width:600px){

header{

    padding:0 20px;

}


.menu a{

    margin-left:10px;
    font-size:14px;

}


h1{

    font-size:32px;

}

}

</style>

</head>


<body>


<header>

<img src="logo.png">


<div class="menu">

<a href="#">Sobre</a>

<a href="#">Contato</a>

</div>


</header>




<section class="principal">


<div class="logo-central">

<img src="logo.png">

</div>



<h1>
Encontre a academia ideal<br>
na sua cidade
</h1>



<p class="subtitulo">
O maior portal de academias do Brasil.
</p>




<div class="caixa-busca">

<select onchange="abrirCidade(this.value)">

<option value="">
📍 Escolha uma cidade
</option>


<option value="montes-claros.html">
Montes Claros
</option>


</select>

</div>




<div class="botao">

<button onclick="abrirCidade('montes-claros.html')">

VER ACADEMIAS

</button>

</div>



</section>





<section class="beneficios">


<div class="item">

<span>🏋️</span>

<br><br>

Academias verificadas

</div>



<div class="item">

<span>📍</span>

<br><br>

Localização exata

</div>




<div class="item">

<span>🕒</span>

<br><br>

Horários atualizados

</div>




<div class="item">

<span>📞</span>

<br><br>

Telefones e WhatsApp

</div>




<div class="item">

<span>⭐</span>

<br><br>

Avaliações

</div>



</section>




<footer>

© BuscaAcademias 2026

</footer>




<script>

function abrirCidade(pagina){

if(pagina){

window.location.href = pagina;

}

}

</script>



</body>
</html>
