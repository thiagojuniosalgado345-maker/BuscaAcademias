<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuscaAcademias</title>

<style>

/* =========================
   CONFIGURAÇÕES GERAIS
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#071a36;
    color:white;
}


/* =========================
   MENU
========================= */

.menu{
    background:#031128;
    min-height:60px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 40px;

    box-shadow:0 2px 12px rgba(0,0,0,.25);

    position:relative;
    z-index:10;
}

.logoMenu{
    color:#fff;
    font-size:28px;
    font-weight:bold;
    white-space:nowrap;
}

.logoMenu span{
    color:#f4b400;
}

.menu ul{
    list-style:none;

    display:flex;
    align-items:center;

    gap:30px;
}

.menu a{
    color:#fff;
    text-decoration:none;

    font-weight:bold;

    transition:.25s;
}

.menu a:hover{
    color:#f4b400;
}

#cidade{
    background:#031128;
    color:white;

    border:none;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
    outline:none;
}

#cidade option{
    color:#333;
    background:white;
}


/* =========================
   ÁREA PRINCIPAL
========================= */

.principal{

    min-height:650px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:35px 20px 60px;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(37,99,235,.18),
            transparent 45%
        );
}


/* =========================
   LOGO CENTRAL
========================= */

.logo-central{
    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:18px;
}

.logo-central img{

    width:500px;

    height:auto;

    max-width:85vw;

    display:block;

    filter:drop-shadow(0 8px 12px rgba(0,0,0,.15));

}


/* =========================
   TÍTULO
========================= */

h1{

    font-size:46px;

    line-height:1.15;

    max-width:850px;

    margin-bottom:18px;

    letter-spacing:-.5px;
}

.subtitulo{

    font-size:21px;

    color:#cbd5e1;

    margin-bottom:38px;

    line-height:1.5;
}


/* =========================
   BUSCA DE CIDADE
========================= */

.caixa-busca{

    background:white;

    width:460px;

    max-width:90%;

    min-height:62px;

    padding:7px;

    border-radius:16px;

    display:flex;

    box-shadow:
        0 10px 30px rgba(0,0,0,.20);

    transition:.25s;
}

.caixa-busca:hover{

    box-shadow:
        0 12px 35px rgba(0,0,0,.27);

    transform:translateY(-1px);
}

.caixa-busca select{

    flex:1;

    border:none;

    padding:15px 16px;

    font-size:17px;

    color:#333;

    outline:none;

    background:white;

    cursor:pointer;

    border-radius:12px;
}


/* =========================
   BOTÃO
========================= */

.botao{

    margin-top:20px;
}

.botao button{

    background:#2563eb;

    border:none;

    color:white;

    padding:16px 48px;

    border-radius:13px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 6px 18px rgba(37,99,235,.30);

    transition:.25s;
}

.botao button:hover{

    background:#3b82f6;

    transform:translateY(-2px);

    box-shadow:
        0 9px 22px rgba(37,99,235,.40);
}

.botao button:active{

    transform:translateY(0);

}


/* =========================
   BENEFÍCIOS
========================= */

.beneficios{

    background:#0d2347;

    padding:45px 30px 50px;

    display:flex;

    justify-content:center;

    gap:20px;

    flex-wrap:wrap;
}

.item{

    background:#132d57;

    width:215px;

    min-height:150px;

    padding:25px 20px;

    border-radius:18px;

    text-align:center;

    font-size:16px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    border:1px solid rgba(255,255,255,.04);

    transition:.25s;

}

.item:hover{

    transform:translateY(-5px);

    background:#163461;

    box-shadow:
        0 8px 22px rgba(0,0,0,.18);
}

.item span{

    font-size:34px;

    line-height:1;

    margin-bottom:14px;
}


/* =========================
   RODAPÉ
========================= */

footer{

    background:#071a36;

    text-align:center;

    padding:28px;

    color:#b8c5db;

    font-size:14px;
}


/* =========================
   CELULAR
========================= */

@media(max-width:700px){

    .menu{

        flex-direction:column;

        min-height:auto;

        padding:15px 20px;

        gap:15px;
    }

    .menu ul{

        flex-wrap:wrap;

        justify-content:center;

        gap:15px;
    }

    .logoMenu{

        font-size:25px;
    }

    .principal{

        min-height:600px;

        padding:35px 15px 50px;
    }

    .logo-central img{

        width:420px;

        max-width:90vw;
    }

    h1{

        font-size:34px;
    }

    .subtitulo{

        font-size:18px;

        margin-bottom:30px;
    }

    .caixa-busca{

        width:95%;
    }

    .botao button{

        padding:15px 38px;
    }

    .item{

        width:200px;
    }

}


@media(max-width:450px){

    .menu ul{

        gap:12px;

        font-size:14px;
    }

    .principal{

        min-height:570px;
    }

    .logo-central img{

        width:340px;
    }

    h1{

        font-size:29px;
    }

    .subtitulo{

        font-size:16px;
    }

    .caixa-busca{

        width:100%;
    }

    .caixa-busca select{

        font-size:15px;
    }

    .item{

        width:100%;

        max-width:300px;
    }

}

</style>

</head>


<body>


<!-- =========================
     MENU
========================= -->

<nav class="menu">

    <div class="logoMenu">

        Busca<span>Academias</span>

    </div>


    <ul>

        <li>

            <a
                href="index.html"
                onclick="irParaInicio(event)"
            >
                Início
            </a>

        </li>


        <li>

            <select
                id="cidade"
                onchange="abrirCidade(this.value)"
            >

                <option value="">
                    📍 Escolha uma cidade
                </option>

                <option value="montes-claros.html">
                    Montes Claros - MG
                </option>

                <option value="janauba.html">
                    Janaúba - MG
                </option>

            </select>

        </li>


        <li>

            <a href="#">
                Sobre
            </a>

        </li>


        <li>

            <a href="#">
                Contato
            </a>

        </li>

    </ul>

</nav>



<!-- =========================
     ÁREA PRINCIPAL
========================= -->

<section class="principal">


    <!-- LOGO -->

    <div class="logo-central">

        <img
            src="3b6a1c52-f088-4290-8cb8-1467f526b368.png"
            alt="BuscaAcademias"
        >

    </div>



    <!-- TÍTULO -->

    <h1>

        Encontre a academia ideal<br>
        na sua cidade

    </h1>


    <p class="subtitulo">

        O maior portal de academias do Brasil.

    </p>



    <!-- ESCOLHA DA CIDADE -->

    <div class="caixa-busca">

        <select onchange="abrirCidade(this.value)">

            <option value="">
                📍 Escolha uma cidade
            </option>

            <option value="montes-claros.html">
                Montes Claros
            </option>

            <option value="janauba.html">
                Janaúba
            </option>

        </select>

    </div>



    <!-- BOTÃO -->

    <div class="botao">

        <button
            onclick="abrirCidade('montes-claros.html')"
        >
            VER ACADEMIAS
        </button>

    </div>


</section>



<!-- =========================
     BENEFÍCIOS
========================= -->

<section class="beneficios">


    <div class="item">

        <span>🏋️</span>

        Academias verificadas

    </div>


    <div class="item">

        <span>📍</span>

        Localização exata

    </div>


    <div class="item">

        <span>🕒</span>

        Horários atualizados

    </div>


    <div class="item">

        <span>📞</span>

        Telefones e WhatsApp

    </div>


    <div class="item">

        <span>⭐</span>

        Avaliações

    </div>


</section>



<!-- =========================
     RODAPÉ
========================= -->

<footer>

    ©️ BuscaAcademias 2026

</footer>



<script>

function abrirCidade(pagina){

    if(pagina){

        window.location.replace(pagina);

    }

}


function irParaInicio(event){

    event.preventDefault();

    window.location.replace("index.html");

}

</script>


</body>

</html>
