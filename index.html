<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuscaAcademias</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#071a36;
    color:white;
}

/* MENU */

.menu{
    background:#031128;
    height:60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
}

.logoMenu{
    color:#fff;
    font-size:28px;
    font-weight:bold;
}

.logoMenu span{
    color:#f4b400;
}

.menu ul{
    list-style:none;
    display:flex;
    gap:30px;
    align-items:center;
}

.menu a{
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.menu a:hover{
    color:#f4b400;
}

#cidade{
    background:#031128;
    color:white;
    border:none;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    outline:none;
}

#cidade option{
    color:black;
    background:white;
}

/* ÁREA PRINCIPAL */

.principal{
    min-height:650px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    padding:25px 30px 50px;
}

/* LOGO CENTRAL */

.logo-central img{
    width:500px;
    height:auto;
    max-width:80vw;
    margin-bottom:10px;
    display:block;
}

/* FRASE PRINCIPAL */

h1{
    font-size:40px;
    line-height:1.15;
    max-width:800px;
    margin-bottom:15px;
}

.subtitulo{
    font-size:21px;
    color:#cbd5e1;
    margin-bottom:25px;
}

/* BUSCA */

.caixa-busca{
    background:white;
    width:450px;
    max-width:90%;
    min-height:58px;
    padding:8px;
    border-radius:16px;
    display:flex;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.caixa-busca select{
    flex:1;
    border:none;
    padding:15px;
    font-size:17px;
    color:#333;
    outline:none;
    background:white;
    border-radius:10px;
    cursor:pointer;
}

/* BOTÃO */

.botao{
    margin-top:20px;
}

.botao button{
    background:#2563eb;
    border:none;
    color:white;
    padding:17px 55px;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 6px 18px rgba(37,99,235,.25);
}

.botao button:hover{
    background:#3b82f6;
    transform:translateY(-2px);
    box-shadow:0 9px 22px rgba(37,99,235,.35);
}

.botao button:active{
    transform:translateY(0);
}

/* BENEFÍCIOS */

.beneficios{
    background:#0d2347;
    padding:50px 30px;
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.item{
    background:#132d57;
    width:220px;
    padding:30px 20px;
    border-radius:18px;
    text-align:center;
    font-size:17px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    transition:.25s;
}

.item:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,.20);
}

.item span{
    font-size:35px;
}

/* RODAPÉ */

footer{
    text-align:center;
    padding:25px;
    color:#b8c5db;
}

/* CELULAR */

@media(max-width:600px){

    .menu{
        flex-direction:column;
        height:auto;
        padding:15px 20px;
        gap:15px;
    }

    .menu ul{
        flex-wrap:wrap;
        justify-content:center;
        gap:15px;
    }

    .principal{
        padding-top:30px;
    }

    .logo-central img{
        width:90%;
        max-width:450px;
    }

    h1{
        font-size:32px;
    }

    .subtitulo{
        font-size:18px;
    }

    .caixa-busca{
        width:450px;
        max-width:90%;
    }

    .botao button{
        padding:16px 45px;
    }

}

/* TELAS MENORES */

@media(max-height:750px) and (min-width:601px){

    .principal{
        padding-top:15px;
    }

    .logo-central img{
        width:450px;
    }

    h1{
        font-size:38px;
    }

    .subtitulo{
        margin-bottom:20px;
    }

    .botao{
        margin-top:15px;
    }

}

</style>
</head>

<body>

<!-- MENU -->

<nav class="menu">

    <div class="logoMenu">
        Busca<span>Academias</span>
    </div>

    <ul>

        <li>
            <a href="index.html" onclick="irParaInicio(event)">
                Início
            </a>
        </li>

        <li>

            <select id="cidade" onchange="abrirCidade(this.value)">

                <option value="">
                    📍 Escolha uma cidade
                </option>

                <option value="montes-claros.html">
                    Montes Claros - MG
                </option>

                <option value="janauba.html">
                    Janaúba - MG
                </option>

            </select>

        </li>

        <li>
            <a href="#">Sobre</a>
        </li>

        <li>
            <a href="#">Contato</a>
        </li>

    </ul>

</nav>


<!-- ÁREA PRINCIPAL -->

<section class="principal">

    <div class="logo-central">

        <img
            src="logo.png"
            alt="BuscaAcademias"
        >

    </div>

    <h1>
        Encontre a academia ideal<br>
        na sua cidade
    </h1>

    <p class="subtitulo">
        O maior portal de academias do Brasil.
    </p>


    <!-- BARRA DE PESQUISA -->

    <div class="caixa-busca">

        <select
            aria-label="Escolha uma cidade"
            onchange="abrirCidade(this.value)"
        >

            <option value="">
                📍 Escolha uma cidade
            </option>

            <option value="montes-claros.html">
                Montes Claros
            </option>

            <option value="janauba.html">
                Janaúba
            </option>

        </select>

    </div>


    <!-- BOTÃO -->

    <div class="botao">

        <button onclick="abrirCidade('montes-claros.html')">
            VER ACADEMIAS
        </button>

    </div>

</section>


<!-- BENEFÍCIOS -->

<section class="beneficios">

    <div class="item">
        <span>🏋️</span>
        <br><br>
        Academias verificadas
    </div>

    <div class="item">
        <span>📍</span>
        <br><br>
        Localização exata
    </div>

    <div class="item">
        <span>🕒</span>
        <br><br>
        Horários atualizados
    </div>

    <div class="item">
        <span>📞</span>
        <br><br>
        Telefones e WhatsApp
    </div>

    <div class="item">
        <span>⭐</span>
        <br><br>
        Avaliações
    </div>

</section>


<!-- RODAPÉ -->

<footer>
    ©️ BuscaAcademias 2026
</footer>


<script>

function abrirCidade(pagina){

    if(pagina){
        window.location.replace(pagina);
    }

}

function irParaInicio(event){

    event.preventDefault();

    window.location.replace("index.html");

}

</script>

</body>
</html>
