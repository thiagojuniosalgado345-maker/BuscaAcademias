<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuscaAcademias</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#fff;
    color:#222;
}

/* CABEÇALHO */

header{
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    border-bottom:1px solid #ddd;
}

.logo-texto{
    font-size:24px;
    font-weight:bold;
    color:#00b85c;
}

nav a{
    margin-left:25px;
    text-decoration:none;
    color:#333;
}


/* LOGO CENTRAL */

.logo-area{
    text-align:center;
    padding:50px 20px 20px;
}

.logo-area img{
    width:180px;
}


/* PRINCIPAL */

.hero{
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:38px;
    margin-bottom:15px;
}

.hero p{
    font-size:20px;
    color:#555;
    margin-bottom:35px;
}


/* BUSCA */

.busca{
    max-width:450px;
    margin:auto;
    border:1px solid #ccc;
    border-radius:12px;
    padding:15px;
    display:flex;
    justify-content:space-between;
}

.busca select{
    border:none;
    font-size:16px;
    flex:1;
    outline:none;
}


.botao{
    margin-top:25px;
}

.botao button{
    background:#00b85c;
    color:white;
    border:none;
    padding:15px 40px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}


/* BENEFÍCIOS */

.beneficios{
    margin-top:60px;
    border-top:1px solid #ddd;
    border-bottom:1px solid #ddd;
    padding:30px;
    display:flex;
    justify-content:center;
    gap:35px;
    flex-wrap:wrap;
}

.beneficio{
    font-size:17px;
}


/* RODAPÉ */

footer{
    text-align:center;
    padding:25px;
    color:#555;
}

</style>

</head>

<body>


<header>

<div class="logo-texto">
BuscaAcademias
</div>

<nav>
<a href="#">Sobre</a>
<a href="#">Contato</a>
</nav>

</header>



<section class="logo-area">

<!-- COLOQUE SUA LOGO AQUI -->
<img src="3b6a1c52-f088-4290-8cb8-1467f526b368.png">

</section>



<section class="hero">

<h1>
Encontre a academia ideal<br>
na sua cidade
</h1>

<p>
O maior portal de academias do Brasil.
</p>


<div class="busca">

<select>
<option>📍 Escolha uma cidade</option>
<option>São Paulo</option>
<option>Rio de Janeiro</option>
<option>Belo Horizonte</option>
</select>

</div>


<div class="botao">

<button>
VER ACADEMIAS
</button>

</div>


</section>



<section class="beneficios">

<div class="beneficio">
🏋️ Academias verificadas
</div>

<div class="beneficio">
📍 Localização exata
</div>

<div class="beneficio">
🕒 Horários atualizados
</div>

<div class="beneficio">
📞 Telefones e WhatsApp
</div>

<div class="beneficio">
⭐ Avaliações
</div>

</section>



<footer>

© BuscaAcademias 2026

</footer>


</body>
</html>
